[project]
name = "tradebot"
version = "0.1.0"
description = "Multi-agent AI trading floor — specialist agents that analyze, strategize, and execute trades"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",

    # Trading & Data
    "ccxt>=4.0",
    "pandas>=2.0,<3.0",
    "pandas-ta>=0.3",
    "mplfinance>=0.12",
    "alpaca-py>=0.30",

    # LLM
    "anthropic>=0.40",
    "openai>=1.50",

    # Database
    "asyncpg>=0.29,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",

    # API / Dashboard backend
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",

    # Notifications
    "python-telegram-bot>=21.0,<22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
